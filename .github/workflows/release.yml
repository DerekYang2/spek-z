name: Release

# Push a tag such as v0.1.0 to publish. The tag has to match <Version> in Directory.Build.props. Running the workflow by
# hand builds the packages without publishing them. App distribution will use the Microsoft Store separately.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Spek.NET tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download ffmpeg
        shell: pwsh
        run: ./scripts/Get-Ffmpeg.ps1 -Architecture x64
      - name: Run the tests
        env:
          SPEK_Z_FFMPEG: ${{ github.workspace }}\ffmpeg\win-x64\ffmpeg.exe
        run: dotnet test tests/Spek.Net.Tests/Spek.Net.Tests.csproj -c Release

  packages:
    name: NuGet packages
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "The tag ${{ github.ref_name }} doesn't match version $version in Directory.Build.props."
          }
      - name: Pack Spek.NET and Spek.NET.WinUI
        run: dotnet pack SpekZ.slnx -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org and GitHub
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Trusted Publishing to nuget.org
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # nuget.org trades the workflow's OIDC token for an API key that lasts an hour. NUGET_USER is the nuget.org
      # profile name, not the email address.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg artifacts/*.snupkg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --repo "$GITHUB_REPOSITORY" --title "Spek.NET ${TAG#v}" --generate-notes $prerelease
          fi
